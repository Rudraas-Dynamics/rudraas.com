# Nginx config for the Careers Portal Admin SPA container.
#
# This is the INNER nginx - it only ever serves this container's own static
# `dist/` output. TLS termination, the public hostname, and rate limiting are
# handled one layer up by the edge nginx in infra/nginx/career.rudraas.com.conf,
# which reverse-proxies to this container over the internal compose network.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Baseline security headers (defense in depth; the edge nginx also sets
    # HSTS/CSP-adjacent headers for the public-facing hostname).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Vite fingerprints (content-hashes) everything under /assets/, so those
    # files are immutable - safe to cache "forever" at the browser/CDN layer.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html references the hashed asset filenames, so IT must never be
    # cached, or clients will get stuck on a stale bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # SPA fallback: any route not matching a real file (client-side routes
    # handled by react-router-dom) falls back to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
