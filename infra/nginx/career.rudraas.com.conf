# Edge nginx config for career.rudraas.com
#
# Mounted read-only into the `nginx` compose service at
# /etc/nginx/conf.d/career.rudraas.com.conf. The stock nginx:1.27-alpine
# image's own nginx.conf already wraps everything under conf.d/*.conf inside
# the top-level `http {}` block, which is why a `limit_req_zone` directive is
# allowed to live here at file scope (http context) rather than inside a
# `server {}` block.
#
# TWO-LAYER NGINX, ON PURPOSE:
#   This file is the *edge* nginx: it terminates TLS, does host/path-based
#   routing, and applies rate limiting. The `career-admin` service is its own
#   nginx (careers-portal/admin-frontend/nginx.conf) that already knows how
#   to serve the SPA correctly (index.html fallback, immutable asset
#   caching, no-cache on index.html). Rather than duplicate that logic here,
#   this outer layer just reverse-proxies everything that isn't `/api/` to
#   `career-admin`, letting that inner nginx own all SPA-specific behavior.

# 5 requests/minute per client IP for the public "submit application" endpoint.
# Keyed on $binary_remote_addr (compact) with a 10MB shared zone (~160k IPs).
limit_req_zone $binary_remote_addr zone=applyzone:10m rate=5r/m;

# ---- HTTP -> HTTPS redirect --------------------------------------------------
server {
    listen 80;
    server_name career.rudraas.com;

    # Allow ACME HTTP-01 challenges through for certbot renewal without
    # bouncing them to HTTPS first.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name career.rudraas.com;

    # Populated out-of-band (certbot standalone/webroot on the host, or any
    # other ACME client) and bind-mounted in at
    # infra/nginx/certs/career.rudraas.com/{fullchain.pem,privkey.pem}.
    # See docs/DEPLOYMENT.md for the full certbot walkthrough + renewal.
    ssl_certificate     /etc/nginx/certs/career.rudraas.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/career.rudraas.com/privkey.pem;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Resumes are capped at 10MB server-side (see career-api upload config);
    # leave ~1MB of headroom for multipart/form-data field overhead.
    client_max_body_size 11m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Rate-limited: candidate application submissions. Declared BEFORE the
    # general /api/ location because nginx's longest-prefix-match semantics
    # for `location` blocks only apply among blocks of the same matching
    # type - an exact-match `location =` always wins over a prefix match
    # regardless of declaration order, but we keep it above /api/ here for
    # readability/maintainability.
    location = /api/v1/applications {
        limit_req zone=applyzone burst=3 nodelay;

        proxy_pass http://career-api:4000/api/v1/applications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API reverse proxy - falls through here for everything else
    # under /api/.
    location /api/ {
        proxy_pass http://career-api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: hand off to the admin SPA's own nginx container,
    # which owns SPA fallback routing and static asset caching.
    location / {
        proxy_pass http://career-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
