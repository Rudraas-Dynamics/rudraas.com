name: career-api-ci

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "careers-portal/backend/**"
  pull_request:
    branches:
      - main
      - "claude/**"
    paths:
      - "careers-portal/backend/**"

defaults:
  run:
    working-directory: careers-portal/backend

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: careers-portal/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Build and push image (GHCR)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./careers-portal/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rudraas-career-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rudraas-career-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
