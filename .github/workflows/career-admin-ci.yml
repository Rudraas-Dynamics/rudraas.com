name: career-admin-ci

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "careers-portal/admin-frontend/**"
  pull_request:
    branches:
      - main
      - "claude/**"
    paths:
      - "careers-portal/admin-frontend/**"

defaults:
  run:
    working-directory: careers-portal/admin-frontend

jobs:
  test:
    name: Lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: careers-portal/admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # VITE_API_BASE_URL isn't needed for this CI build step itself (it
        # only matters for the Docker image build below, where Vite actually
        # inlines it into the bundle); this build just proves `tsc -b && vite
        # build` succeeds.
        run: npm run build

  docker:
    name: Build and push image (GHCR)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./careers-portal/admin-frontend
          push: true
          # ADMIN_API_BASE_URL is the public career-api URL (not a secret),
          # so it's sourced from a repo/environment VARIABLE
          # (Settings -> Secrets and variables -> Actions -> Variables ->
          # ADMIN_API_BASE_URL), not a secret. Vite inlines this into the
          # static JS bundle at build time - see admin-frontend/Dockerfile.
          build-args: |
            VITE_API_BASE_URL=${{ vars.ADMIN_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rudraas-career-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rudraas-career-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
